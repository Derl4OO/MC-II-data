# MotoCesta data pro celou Evropu: každá země zvlášť a souběžně, pak spojení a nasazení na GitHub Pages.
# Země jsou v config/countries.json (přidat zemi = přidat řádek). Zkopírovat do .github/workflows/data.yml.
name: Data MotoCesta (Evropa)

on:
  schedule:
    - cron: "17 3 * * 1"   # každé pondělí ráno
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.list.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "countries=$(python3 -c 'import json; print(json.dumps([{"id": c["id"], "geofabrik": c["geofabrik"]} for c in json.load(open("config/countries.json"))["countries"]]))')" >> "$GITHUB_OUTPUT"

  country:
    needs: setup
    name: ${{ matrix.country.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        country: ${{ fromJSON(needs.setup.outputs.countries) }}
    steps:
      - uses: actions/checkout@v4
      - name: Nástroje
        run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - name: Stažení OpenStreetMap (Geofabrik)
        run: curl -sSfL --retry 3 -o ${{ matrix.country.id }}.osm.pbf https://download.geofabrik.de/${{ matrix.country.geofabrik }}-latest.osm.pbf
      - name: Minulá přijatá verze
        uses: actions/cache/restore@v4
        with:
          path: accepted/${{ matrix.country.id }}
          key: country-${{ matrix.country.id }}-${{ github.run_id }}
          restore-keys: country-${{ matrix.country.id }}-
      - name: Sestavení země
        run: python3 scripts/region.py ${{ matrix.country.id }} work out/${{ matrix.country.id }} accepted/${{ matrix.country.id }}
      - name: Přijatá verze pro příště
        id: accepted
        run: |
          if [ -f out/${{ matrix.country.id }}/ACCEPTED ]; then
            rm -rf accepted/${{ matrix.country.id }} && mkdir -p accepted && cp -r out/${{ matrix.country.id }} accepted/
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.accepted.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: accepted/${{ matrix.country.id }}
          key: country-${{ matrix.country.id }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.country.id }}
          path: out/${{ matrix.country.id }}
          retention-days: 3

  site:
    needs: [setup, country]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Cloudflare R2 (see Tools/R2-postup.md); without these secrets everything goes only to GitHub Pages.
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Složky zemí
        run: cd parts && for d in part-*; do mv "$d" "${d#part-}"; done && ls
      - name: Spojení a sestavení webu
        run: python3 scripts/merge.py parts work site pages
      - name: Nahrání všech dat do Cloudflare R2
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync site/v1 "s3://$R2_BUCKET/v1" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --size-only --delete --only-show-errors
          # small files that may change without changing size: always upload
          E="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          for f in meta.json config.json; do aws s3 cp "site/v1/$f" "s3://$R2_BUCKET/v1/$f" --endpoint-url "$E" --only-show-errors; done
          aws s3 sync site/v1/style "s3://$R2_BUCKET/v1/style" --endpoint-url "$E" --exact-timestamps --only-show-errors
      - name: Upozornění na problém (GitHub issue → e-mail)
        if: ${{ hashFiles('problems.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Data MotoCesta – kontrola našla problém" --body-file problems.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
